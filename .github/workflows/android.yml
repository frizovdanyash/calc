name: Android build and release

on:
  push:
    branches:
      - main
      - arena/**
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vektor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Вектор ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Вектор — научный калькулятор для Android**

            Установочный APK: `app-debug.apk` (подписан отладочным ключом и готов для установки вручную).

            Исходный код и инструкции по сборке доступны в репозитории.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
