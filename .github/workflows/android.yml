name: Calculator Android build and release

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Calculator APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug > gradle-build.log 2>&1
          status=$?
          cat gradle-build.log
          if [ "$status" -ne 0 ]; then
            echo "## Gradle failure details" >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              case "$line" in
                e:*|*FAILURE:*|*error:*|*"What went wrong:"*) echo "::error::$line" ;;
              esac
            done < gradle-build.log
            exit "$status"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Calculator ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Calculator — калькулятор для Android с Material Design 3**

            Установочный APK: `app-debug.apk` (подписан отладочным ключом и готов для установки вручную).

            Исходный код и инструкция по сборке находятся в репозитории.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
